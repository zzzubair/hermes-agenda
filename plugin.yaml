name: agenda
version: "0.1.0"
description: "The agent's running todo list: shown every turn, one `agenda` tool to add/tick/drop/snooze/edit/search; closed items go to a searchable archive; reminders via the wake plugin."
provides_hooks:
  - pre_llm_call
provides_tools:
  - agenda
config_schema:
  user_name:
    type: string
    default: "the user"
    label: Your name
    description: Who the agent works for; shown on items they own and in reminder prompts.
  max_tokens:
    type: integer
    default: 600
    label: Context budget (tokens)
    description: Max size of the list injected each turn (about 4 characters per token). Later items collapse into a count; `agenda list` shows everything.
